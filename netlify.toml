# SuperLikers / IWIN — FinOps Dashboard · Netlify (deploy raíz, drag-and-drop)
[build]
  publish   = "."
  functions = "netlify/functions"

# Datos del ETL (Drive)
[[redirects]]
  from   = "/api/data"
  to     = "/.netlify/functions/finops-data"
  status = 200

# Asistente IA
[[redirects]]
  from   = "/api/ia"
  to     = "/.netlify/functions/finops-ia"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
